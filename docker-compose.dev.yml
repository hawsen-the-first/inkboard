version: '3.9'
services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend/src:/app/src
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/inkboard
      - PORT=3001
    depends_on:
      - mongodb

volumes:
  mongo_data_dev:
