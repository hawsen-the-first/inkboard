version: '3.9'
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - inkboard

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      - MONGO_URI=mongodb://mongodb:27017/inkboard
      - PORT=3001
    depends_on:
      - mongodb
    networks:
      - inkboard

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - inkboard

volumes:
  mongo_data:

networks:
  inkboard:
